<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bli medlem | Start NMBU</title>
    <meta
      name="description"
      content="Informasjon om neste opptak i Start NMBU og nedtelling til høst 2026."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="./index.html" aria-label="Start NMBU">
          <img
            src="./assets/images/start1-1.png"
            alt="Start NMBU"
          />
        </a>

        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-nav">
          Meny
        </button>

        <nav id="main-nav" class="main-nav" aria-label="Hovedmeny">
          <a href="./styret.html">Styret</a>
          <a href="./index.html#prosjektgrupper">Prosjektgrupper</a>
          <a href="./index.html#faq">FAQ</a>
          <a href="./om-oss.html">Om oss</a>
          <a class="nav-cta" href="./bli-medlem.html">Bli medlem</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="section recruit-hero">
        <div class="container recruit-shell">
          <span class="eyebrow">Opptak</span>
          <h1>Neste opptak er Januar 2027.</h1>
          <p class="lead">
            Vi teller ned til neste opptaksrunde. Søknadsvinduet åpner 1. Januar 2027.
          </p>

          <div class="countdown" data-target="2027-01-01T00:00:00+02:00">
            <div class="countdown-card">
              <span class="count-value" data-unit="days">0</span>
              <span class="count-label">Dager</span>
            </div>
            <div class="countdown-card">
              <span class="count-value" data-unit="hours">0</span>
              <span class="count-label">Timer</span>
            </div>
            <div class="countdown-card">
              <span class="count-value" data-unit="minutes">0</span>
              <span class="count-label">Minutter</span>
            </div>
            <div class="countdown-card">
              <span class="count-value" data-unit="seconds">0</span>
              <span class="count-label">Sekunder</span>
            </div>
          </div>

          <p class="countdown-note" data-countdown-message>
            
          </p>

          <a class="button button-secondary" href="./index.html">Tilbake til forsiden</a>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <img
          class="footer-logo"
          src="./assets/images/nmbu_logo_hvit.png"
          alt="NMBU"
        />
        <p>© 2024 Start Norge. Alle rettigheter reservert. Laget av Start NMBU</p>
      </div>
    </footer>

    <script src="./script.js"></script>
  </body>
